# Builds a release from its tag, attests the files, and drafts the GitHub
# release with them. Push a commit and its version tag (1.34.1, no "v"),
# then review the draft and publish it. See RELEASING.md.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check that the tag names the manifest's version
        run: test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"

      - run: npm run build

      - run: npm test

      - name: Check that the committed stylesheet matches the build
        run: git diff --exit-code -- styles.css

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --draft --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
